[project]
name = "auto-clipper"
version = "0.1.0"
description = "Local Twitch/YouTube -> ranked, captioned 9:16 short-form clips. No LLM."
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.10.0",
    "faster-whisper>=1.0.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9,<5",
    "pillow>=10.3",
    "chat-downloader>=0.2.8",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
mediapipe = ["mediapipe>=0.10"]
scenedetect = ["scenedetect[opencv-headless]>=0.6.4"]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipper"]
